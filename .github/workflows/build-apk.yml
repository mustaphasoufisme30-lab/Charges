name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          yes "" | bubblewrap build --manifest=https://charges-ige9.vercel.app/manifest.json --directory=./twa-app --skipPwaValidation --skipSdkValidation
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-APK
          path: |
            ./twa-app/app/build/outputs/apk/debug/*.apk
            ./twa-app/app/build/outputs/bundle/release/*.aab
