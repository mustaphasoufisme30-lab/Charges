name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA Project
        run: |
          bubblewrap init --manifest=https://charges-ige9.vercel.app/manifest.json --directory=./twa-app --packageId=com.mustapha.charguard --name=ChargeGuard --launcherName=ChargeGuard --display=standalone --themeColor=#22c55e --backgroundColor=#000000 --startUrl=/ --icon=https://charges-ige9.vercel.app/icon-512.png --maskableIcon=https://charges-ige9.vercel.app/icon-512.png --splashScreenFadeOutDuration=300 --enableNotifications=false --skipPwaValidation --skipSdkValidation

      - name: Build APK
        run: |
          cd ./twa-app
          bubblewrap build --skipPwaValidation --skipSdkValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-APK
          path: ./twa-app/app/build/outputs/apk/debug/*.apk
