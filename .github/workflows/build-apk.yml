name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build Android APK
        run: |
          pwabuilder https://chargeguard.vercel.app -p android -m ./public/manifest.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeGuard-APK
          path: ./pwabuilder-android/*.apk
