<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChargeGuard - Vraie Batterie</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#050a1a;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  h1{font-size:22px;color:#00e5ff;margin-bottom:5px}
  p.sub{color:#8892a8;font-size:13px;margin-bottom:25px}
  .circle{width:260px;height:260px;border-radius:50%;background:conic-gradient(#00e5ff 0%, #1a2340 0%);display:flex;align-items:center;justify-content:center;position:relative;transition:0.5s}
  .inner{width:215px;height:215px;background:#050a1a;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #pct{font-size:64px;font-weight:900}
  #status{font-size:16px;margin-top:5px;color:#00e5ff}
  #info{margin-top:20px;background:#101a35;padding:15px 20px;border-radius:15px;width:100%;max-width:320px}
  #info div{margin:8px 0;font-size:15px}
  #alertBox{display:none;position:fixed;inset:0;background:#ff0000;z-index:99;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  #alertBox h2{font-size:34px;line-height:1.2}
  #stopBtn{margin-top:30px;background:white;color:red;border:none;padding:18px 30px;font-size:20px;font-weight:900;border-radius:50px}
  #testBtn{margin-top:15px;background:#00e5ff;color:black;border:none;padding:12px 20px;border-radius:10px;font-weight:bold}
  .small{margin-top:15px;color:#8892a8;font-size:12px}
</style>
</head>
<body>
  <h1>⚡ ChargeGuard</h1>
  <p class="sub">Synchronisation réelle avec ta batterie</p>

  <div class="circle" id="circle">
    <div class="inner">
      <div id="pct">--%</div>
      <div id="status">Connexion...</div>
    </div>
  </div>

  <div id="info">
    <div>🔋 Niveau : <b id="levelTxt">--</b></div>
    <div>🔌 Charge : <b id="chargeTxt">--</b></div>
    <div>⏱️ Temps : <b id="timeTxt">--</b></div>
  </div>

  <button id="testBtn" onclick="testSon()">🔔 Tester le son d'alerte</button>
  <p class="small">Ouvre ce fichier dans Chrome sur Android.<br>Si le % = celui en haut de ton écran, c'est que ça marche.</p>

  <div id="alertBox">
    <h2>🔋 BATTERIE PLEINE<br>100%<br><br>DÉBRANCHE TON CHARGEUR !</h2>
    <button id="stopBtn" onclick="stopAlerte()">ARRÊTER L'ALERTE</button>
  </div>

<script>
let audioCtx, intervalSon, enAlerte = false;

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type='square';
    g.gain.value = 0.3;
    o.start(); o.stop(audioCtx.currentTime + 0.5);
    if(navigator.vibrate) navigator.vibrate(500);
  }catch(e){}
}

function lancerAlerte(){
  if(enAlerte) return;
  enAlerte = true;
  document.getElementById('alertBox').style.display='flex';
  beep();
  intervalSon = setInterval(beep, 1000);
}

function stopAlerte(){
  enAlerte = false;
  clearInterval(intervalSon);
  document.getElementById('alertBox').style.display='none';
  if(navigator.vibrate) navigator.vibrate(0);
}

function testSon(){ beep(); alert("Si tu as entendu le beep, le son marche !"); }

async function init(){
  try{
    const battery = await navigator.getBattery();
    function update(){
      const pct = Math.round(battery.level * 100);
      document.getElementById('pct').innerText = pct + '%';
      document.getElementById('levelTxt').innerText = pct + '%';
      document.getElementById('chargeTxt').innerText = battery.charging ? 'En charge ⚡' : 'Pas en charge';
      document.getElementById('status').innerText = battery.charging ? 'En charge ⚡' : 'Pas en charge';
      document.getElementById('circle').style.background = `conic-gradient(#00e5ff ${pct}%, #1a2340 ${pct}%)`;
      if(battery.charging && battery.chargingTime !== Infinity){
        document.getElementById('timeTxt').innerText = Math.round(battery.chargingTime/60)+' min restantes';
      } else if(!battery.charging && battery.dischargingTime !== Infinity){
        document.getElementById('timeTxt').innerText = Math.round(battery.dischargingTime/60)+' min restantes';
      } else {
        document.getElementById('timeTxt').innerText = '--';
      }
      // ALERTE 100%
      if(pct >= 100 && battery.charging){
        lancerAlerte();
      }
      // Si on débranche, on coupe l'alerte
      if(!battery.charging && enAlerte){
        stopAlerte();
      }
    }
    update();
    battery.addEventListener('levelchange', update);
    battery.addEventListener('chargingchange', update);
  }catch(e){
    document.getElementById('status').innerText = 'Non autorisé par le navigateur';
    document.getElementById('pct').innerText = 'Erreur';
  }
}
init();
</script>
</body>
</html>
