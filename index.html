<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ChargeGuard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:#050a1a;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:background 0.4s;overflow:hidden}
  #mainWrap{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;transition:transform 1.5s ease-in-out}
  .netStatus{position:fixed;top:10px;right:10px;background:#222;padding:6px 12px;border-radius:20px;font-size:12px;z-index:10}
  h1{font-size:22px;color:#00e5ff;margin-bottom:5px}
  p.sub{color:#8892a8;font-size:13px;margin-bottom:25px}
  .circle{width:260px;height:260px;border-radius:50%;background:conic-gradient(#00e5ff 0%, #1a2340 0%);display:flex;align-items:center;justify-content:center;position:relative;transition:0.5s}
  .inner{width:215px;height:215px;background:#050a1a;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 0.4s}
  #pct{font-size:64px;font-weight:900}
  #status{font-size:16px;margin-top:5px;color:#00e5ff}
  #info{margin-top:20px;background:#101a35;padding:15px 20px;border-radius:15px;width:100%;max-width:320px;transition:0.4s}
  #info div{margin:8px 0;font-size:15px}
  #alertBox{display:none;position:fixed;inset:0;background:#ff8800;z-index:99;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  #alertBox h2{font-size:34px;line-height:1.2}
  #stopBtn{margin-top:30px;background:white;color:#ff5500;border:none;padding:18px 30px;font-size:20px;font-weight:900;border-radius:50px;cursor:pointer}
  .btn{margin-top:12px;background:#00e5ff;color:black;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;max-width:320px;font-size:15px;transition:0.3s}
  .btn.active{background:#00c853;color:white}
  #installBtn{display:none;background:#ffab00;color:black}
  .small{margin-top:15px;color:#8892a8;font-size:12px}
  body.eco-mode{background:#000000}
  body.eco-mode .inner{background:#000000}
  body.eco-mode h1, body.eco-mode p.sub, body.eco-mode #info, body.eco-mode .small, body.eco-mode #testBtn,
